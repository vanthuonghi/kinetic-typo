name: Render Video

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Cho phép chạy thủ công từ GitHub UI

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TTS_VOICE: vi-VN-HoaiMyNeural

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Edge TTS
        run: pip install edge-tts

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate voiceover
        run: python3 scripts/generate-tts.py

      - name: Stage voiceover for Remotion
        run: mkdir -p public && cp -f voiceover.mp3 public/voiceover.mp3

      - name: Render video
        run: npx remotion render src/Root.tsx Video out/video.mp4 --codec h264 --crf 18

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-15s
          path: out/video.mp4
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "✅ Video rendered successfully!"
          echo "📹 Download from: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "📋 Script đã dùng:"
          cat script.txt
