name: Render Video
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TTS_VOICE: vi-VN-HoaiMyNeural

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Edge TTS
        run: pip install edge-tts==7.3.1

      - name: Set TTS voice in config
        run: python3 -c "import json; p='src/video-config.json'; d=json.load(open(p)); d['voice']='${{ env.TTS_VOICE }}'; json.dump(d, open(p,'w'), ensure_ascii=False, indent=2)"

      - name: Prepare audio + timings
        run: python3 scripts/prepare.py

      - name: Render video
        run: npx remotion render src/Root.tsx Video out/video.mp4 --codec h264 --crf 18 --concurrency 4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-15s
          path: out/video.mp4
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "✅ Video rendered successfully!"
          python3 -c "import json; d=json.load(open('src/video-config.json')); print('Scenes:', len(d['scenes']), 'TotalMs:', d['totalMs'])"
