name: Render Video
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      topic:
        description: "Chủ đề video (tự động sinh script nếu có)"
        required: false
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TTS_VOICE: vi-VN-HoaiMyNeural
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      # Whisper model used to measure word timings; "base" is enough when the
      # text is already known, "small" is slower but more accurate.
      ALIGN_MODEL: base

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Edge TTS + forced aligner
        run: pip install edge-tts==7.3.1 faster-whisper==1.1.1

      - name: Cache alignment model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-ct2-${{ env.ALIGN_MODEL }}

      - name: Set TTS voice in config
        run: python3 -c "import json; p='src/video-config.json'; d=json.load(open(p)); d['voice']='${{ env.TTS_VOICE }}'; json.dump(d, open(p,'w'), ensure_ascii=False, indent=2)"

      - name: Generate script (if topic provided via workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.topic != '' && env.ARK_API_KEY != ''
        run: python3 scripts/generate_script.py

      - name: Show script content
        run: |
          echo "=== video-config.json ==="
          python3 -c "import json; d=json.load(open('src/video-config.json')); print('Scenes:', len(d['scenes'])); [print(f'  {s[\"kind\"]}: {s[\"text\"]}') for s in d['scenes']]"

      - name: Prepare audio + timings
        run: python3 scripts/prepare.py

      # Diagnostic only: configs with audioMode "pre_timed" already ship exact
      # timings, but this proves the aligner still works for edge-tts configs.
      - name: Probe forced aligner
        run: |
          python3 scripts/align.py --selftest
          python3 - <<'PY'
          import glob, sys
          sys.path.insert(0, "scripts")
          clips = sorted(glob.glob("public/_ts/*.mp3") + glob.glob("public/_tts/*.mp3"))
          if not clips:
              print("PROBE: no scene clips in this config (nothing to measure)")
              raise SystemExit(0)
          try:
              import align
              words = align.heard_words(clips[0])
              print(f"PROBE: {clips[0]} -> {len(words)} words",
                    [(w['t'], w['s'], w['e']) for w in words[:5]])
          except Exception as exc:
              print(f"PROBE FAILED: {type(exc).__name__}: {exc}")
          PY

      - name: Quality gate
        run: python3 scripts/check_quality.py

      - name: Render video
        run: npx remotion render src/Root.tsx Video out/video.mp4 --codec h264 --crf 18 --concurrency 4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-typo-video
          path: out/video.mp4
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "✅ Video rendered successfully!"
          python3 -c "import json; d=json.load(open('src/video-config.json')); print('Scenes:', len(d['scenes']), 'TotalMs:', d['totalMs'], f'({d[\"totalMs\"]/1000:.1f}s)'); print('Measured timings:', sum(1 for s in d['scenes'] if s.get('alignSource')=='whisper'), '/', len(d['scenes'])); print('Music:', (d.get('music') or {}).get('track', 'none'))"
          ls -lh out/video.mp4
