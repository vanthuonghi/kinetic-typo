name: Render Video
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      topic:
        description: "Chủ đề video (tự động sinh script nếu có)"
        required: false
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TTS_VOICE: vi-VN-HoaiMyNeural
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Edge TTS
        run: pip install edge-tts==7.3.1

      - name: Set TTS voice in config
        run: python3 -c "import json; p='src/video-config.json'; d=json.load(open(p)); d['voice']='${{ env.TTS_VOICE }}'; json.dump(d, open(p,'w'), ensure_ascii=False, indent=2)"

      - name: Generate script (if topic provided via workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.topic != '' && env.ARK_API_KEY != ''
        run: python3 scripts/generate_script.py

      - name: Show script content
        run: |
          echo "=== video-config.json ==="
          python3 -c "import json; d=json.load(open('src/video-config.json')); print('Scenes:', len(d['scenes'])); [print(f'  {s[\"kind\"]}: {s[\"text\"]}') for s in d['scenes']]"

      - name: Prepare audio + timings
        run: python3 scripts/prepare.py

      - name: Quality gate
        run: python3 scripts/check_quality.py

      - name: Render video
        run: npx remotion render src/Root.tsx Video out/video.mp4 --codec h264 --crf 18 --concurrency 4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-typo-video
          path: out/video.mp4
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "✅ Video rendered successfully!"
          python3 -c "import json; d=json.load(open('src/video-config.json')); print('Scenes:', len(d['scenes']), 'TotalMs:', d['totalMs'], f'({d[\"totalMs\"]/1000:.1f}s)')"
          ls -lh out/video.mp4
